<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460"
     font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Three Kinds of DGX System</title>
  <desc id="d">A comparison grid with three columns: desktop personal system, desktop workstation, and rack server. The first row draws each device. The rows below give the typical shape, the CPU architecture, and the GPU memory arrangement of each.</desc>

  <defs>
    <!-- Perforated front panel used on all three devices -->
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#6E5F36"/>
      <circle cx="4" cy="4" r="0.9" fill="#6E5F36"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3A1"/>
      <stop offset="1" stop-color="#C5AE74"/>
    </linearGradient>
    <!-- Mounting holes on the two rack posts -->
    <pattern id="holesL" x="530" y="102" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect x="3.5" y="2.5" width="3" height="3" fill="#CBD5E0"/>
    </pattern>
    <pattern id="holesR" x="686" y="102" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect x="3.5" y="2.5" width="3" height="3" fill="#CBD5E0"/>
    </pattern>
    <!-- One GPU module in the rack server drawing -->
    <g id="gpu-module">
      <rect y="133" width="12.5" height="50" rx="1.5" fill="#3D434B"/>
      <rect y="133" width="12.5" height="9" rx="1.5" fill="#23783F"/>
      <g stroke="#7B8794" stroke-width="0.9">
        <line x1="2" y1="148" x2="10.5" y2="148"/>
        <line x1="2" y1="154" x2="10.5" y2="154"/>
        <line x1="2" y1="160" x2="10.5" y2="160"/>
        <line x1="2" y1="166" x2="10.5" y2="166"/>
        <line x1="2" y1="172" x2="10.5" y2="172"/>
        <line x1="2" y1="178" x2="10.5" y2="178"/>
      </g>
    </g>
    <!-- One GPU with its own memory in the rack server memory row -->
    <g id="gpu-with-memory">
      <rect y="356" width="17" height="18" rx="2.5" fill="#23783F"/>
      <line x1="8.5" y1="374" x2="8.5" y2="382" stroke="#2A2E3A" stroke-width="1.5"/>
      <rect y="382" width="17" height="14" rx="2.5" fill="#2F6FB5"/>
    </g>
  </defs>

  <!-- Background and title bar -->
  <rect width="720" height="460" fill="#F8F9FA"/>
  <rect width="720" height="42" fill="#2A2E3A"/>
  <text x="360" y="27" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Three Kinds of DGX System</text>

  <!-- Row label column -->
  <rect x="8" y="50" width="92" height="402" rx="8" fill="#E3E8EE"/>
  <g stroke="#F8F9FA" stroke-width="2">
    <line x1="8" y1="96" x2="100" y2="96"/>
    <line x1="8" y1="246" x2="100" y2="246"/>
    <line x1="8" y1="296" x2="100" y2="296"/>
    <line x1="8" y1="350" x2="100" y2="350"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#2A2E3A" text-anchor="middle">
    <text x="54" y="70">Kind of</text>
    <text x="54" y="85">system</text>
    <text x="54" y="175">Device</text>
    <text x="54" y="268">Typical</text>
    <text x="54" y="283">shape</text>
    <text x="54" y="320">CPU</text>
    <text x="54" y="335">architecture</text>
    <text x="54" y="399">GPU</text>
    <text x="54" y="414">memory</text>
  </g>

  <!-- Column bodies -->
  <rect x="106" y="50" width="198" height="402" rx="8" fill="#E4F1F5"/>
  <rect x="310" y="50" width="198" height="402" rx="8" fill="#EEE8F8"/>
  <rect x="514" y="50" width="198" height="402" rx="8" fill="#FAEDE3"/>

  <!-- Column headers -->
  <path d="M106,96 V58 Q106,50 114,50 H296 Q304,50 304,58 V96 Z" fill="#0F6E86"/>
  <path d="M310,96 V58 Q310,50 318,50 H500 Q508,50 508,58 V96 Z" fill="#6A3FB5"/>
  <path d="M514,96 V58 Q514,50 522,50 H704 Q712,50 712,58 V96 Z" fill="#B4501A"/>
  <g font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="205" y="78">Desktop personal system</text>
    <text x="409" y="78">Desktop workstation</text>
    <text x="613" y="78">Rack server</text>
  </g>

  <!-- Row separators -->
  <g stroke="#FFFFFF" stroke-width="2">
    <line x1="106" y1="246" x2="304" y2="246"/>
    <line x1="106" y1="296" x2="304" y2="296"/>
    <line x1="106" y1="350" x2="304" y2="350"/>
    <line x1="310" y1="246" x2="508" y2="246"/>
    <line x1="310" y1="296" x2="508" y2="296"/>
    <line x1="310" y1="350" x2="508" y2="350"/>
    <line x1="514" y1="246" x2="712" y2="246"/>
    <line x1="514" y1="296" x2="712" y2="296"/>
    <line x1="514" y1="350" x2="712" y2="350"/>
  </g>

  <!-- ============ Row 1: device drawings ============ -->

  <!-- Desktop personal system: a small box on a desk, with a mug for scale -->
  <g transform="translate(0,-8)">
    <rect x="114" y="206" width="182" height="8" rx="2" fill="#B98B5E"/>
    <rect x="114" y="212" width="182" height="2" fill="#8F6A45"/>
    <ellipse cx="188" cy="206.5" rx="56" ry="3" fill="#000000" opacity="0.18"/>
    <polygon points="144,174 232,174 224,162 152,162" fill="#EFE3BC" stroke="#8C7A45" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="138" y="174" width="100" height="32" rx="5" fill="url(#gold)" stroke="#8C7A45" stroke-width="1.2"/>
    <rect x="158" y="179" width="60" height="22" rx="3" fill="#B49C5C"/>
    <rect x="158" y="179" width="60" height="22" rx="3" fill="url(#mesh)"/>
    <rect x="143" y="179" width="10" height="22" rx="4" fill="#7A6A3C"/>
    <rect x="223" y="179" width="10" height="22" rx="4" fill="#7A6A3C"/>
    <!-- mug -->
    <path d="M278,180 q13,0 13,9 q0,9 -13,9" fill="none" stroke="#4A5568" stroke-width="3"/>
    <rect x="254" y="170" width="24" height="36" rx="3" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/>
    <ellipse cx="266" cy="173" rx="10" ry="2" fill="#6B4A2B"/>
    <g fill="none" stroke="#9AA5B1" stroke-width="1.5" stroke-linecap="round">
      <path d="M262,164 q-3,-4 0,-8 q3,-4 0,-8"/>
      <path d="M270,164 q-3,-4 0,-8 q3,-4 0,-8"/>
    </g>
  </g>

  <!-- Desktop workstation: a tower -->
  <g>
    <line x1="326" y1="232" x2="492" y2="232" stroke="#9AA5B1" stroke-width="1.5"/>
    <ellipse cx="420" cy="232" rx="50" ry="4" fill="#000000" opacity="0.15"/>
    <polygon points="376,118 430,118 456,108 402,108" fill="#EFE3BC" stroke="#8C7A45" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="430,118 456,108 456,222 430,232" fill="#B39B5E" stroke="#8C7A45" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="376" y="118" width="54" height="114" rx="3" fill="url(#gold)" stroke="#8C7A45" stroke-width="1.2"/>
    <rect x="383" y="126" width="40" height="86" rx="3" fill="#B49C5C"/>
    <rect x="383" y="126" width="40" height="86" rx="3" fill="url(#mesh)"/>
    <circle cx="397" cy="222" r="3" fill="#2A2E3A"/>
    <circle cx="409" cy="222" r="1.8" fill="#23783F"/>
    <g stroke="#8C7A45" stroke-width="1.2" opacity="0.75">
      <line x1="436" y1="134" x2="450" y2="128.6"/>
      <line x1="436" y1="142" x2="450" y2="136.6"/>
      <line x1="436" y1="150" x2="450" y2="144.6"/>
      <line x1="436" y1="158" x2="450" y2="152.6"/>
      <line x1="436" y1="166" x2="450" y2="160.6"/>
    </g>
  </g>

  <!-- Rack server: a chassis between two rack posts, with eight GPU modules showing -->
  <g>
    <rect x="540" y="106" width="146" height="12" rx="1.5" fill="#D9DEE5"/>
    <rect x="540" y="228" width="146" height="12" rx="1.5" fill="#D9DEE5"/>
    <rect x="530" y="102" width="10" height="140" fill="#4A5568"/>
    <rect x="530" y="102" width="10" height="140" fill="url(#holesL)"/>
    <rect x="686" y="102" width="10" height="140" fill="#4A5568"/>
    <rect x="686" y="102" width="10" height="140" fill="url(#holesR)"/>
    <rect x="540" y="122" width="146" height="102" rx="3" fill="url(#gold)" stroke="#8C7A45" stroke-width="1.2"/>
    <rect x="547" y="129" width="132" height="58" rx="2" fill="#1F2226"/>
    <use href="#gpu-module" x="550.75"/>
    <use href="#gpu-module" x="566.75"/>
    <use href="#gpu-module" x="582.75"/>
    <use href="#gpu-module" x="598.75"/>
    <use href="#gpu-module" x="614.75"/>
    <use href="#gpu-module" x="630.75"/>
    <use href="#gpu-module" x="646.75"/>
    <use href="#gpu-module" x="662.75"/>
    <rect x="547" y="192" width="132" height="26" rx="2" fill="#B49C5C"/>
    <rect x="547" y="192" width="132" height="26" rx="2" fill="url(#mesh)"/>
  </g>

  <!-- ============ Row 2: typical shape ============ -->
  <g font-size="13.5" fill="#1F2430" text-anchor="middle">
    <text x="205" y="276">Small box on a desk</text>
    <text x="409" y="267">Tower with a large</text>
    <text x="409" y="284">coherent memory pool</text>
    <text x="613" y="276">Eight GPUs in one chassis</text>
  </g>

  <!-- ============ Row 3: CPU architecture ============ -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16.5" font-weight="700" fill="#1F2430" text-anchor="middle">
    <text x="205" y="320">aarch64</text>
    <text x="409" y="320">aarch64</text>
    <text x="613" y="320">x86_64</text>
  </g>
  <g font-size="12.5" fill="#4A5568" text-anchor="middle">
    <text x="205" y="339">64-bit Arm</text>
    <text x="409" y="339">64-bit Arm</text>
    <text x="613" y="339">Intel or AMD</text>
  </g>

  <!-- ============ Row 4: GPU memory ============ -->

  <!-- Desktop personal system: CPU and GPU on one chip, one shared pool -->
  <g>
    <rect x="143" y="356" width="124" height="28" rx="5" fill="#FFFFFF" stroke="#2A2E3A" stroke-width="1.5"/>
    <rect x="149" y="361" width="52" height="18" rx="3" fill="#5B6472"/>
    <rect x="209" y="361" width="52" height="18" rx="3" fill="#23783F"/>
    <line x1="175" y1="384" x2="175" y2="392" stroke="#2A2E3A" stroke-width="1.5"/>
    <line x1="235" y1="384" x2="235" y2="392" stroke="#2A2E3A" stroke-width="1.5"/>
    <rect x="149" y="392" width="112" height="16" rx="4" fill="#2F6FB5"/>
    <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="175" y="374.5">CPU</text>
      <text x="235" y="374.5">GPU</text>
      <text x="205" y="404">memory</text>
    </g>
  </g>

  <!-- Desktop workstation: CPU and GPU share one larger pool -->
  <g>
    <rect x="353" y="361" width="52" height="18" rx="3" fill="#5B6472"/>
    <rect x="413" y="361" width="52" height="18" rx="3" fill="#23783F"/>
    <line x1="379" y1="379" x2="379" y2="392" stroke="#2A2E3A" stroke-width="1.5"/>
    <line x1="439" y1="379" x2="439" y2="392" stroke="#2A2E3A" stroke-width="1.5"/>
    <rect x="321" y="392" width="176" height="16" rx="4" fill="#2F6FB5"/>
    <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="379" y="374.5">CPU</text>
      <text x="439" y="374.5">GPU</text>
      <text x="409" y="404">memory</text>
    </g>
  </g>

  <!-- Rack server: eight GPUs, each with its own memory -->
  <g transform="translate(0,6)">
    <use href="#gpu-with-memory" x="531"/>
    <use href="#gpu-with-memory" x="552"/>
    <use href="#gpu-with-memory" x="573"/>
    <use href="#gpu-with-memory" x="594"/>
    <use href="#gpu-with-memory" x="615"/>
    <use href="#gpu-with-memory" x="636"/>
    <use href="#gpu-with-memory" x="657"/>
    <use href="#gpu-with-memory" x="678"/>
  </g>

  <g font-size="13.5" fill="#1F2430" text-anchor="middle">
    <text x="205" y="427">One chip, memory</text>
    <text x="205" y="443">shared with the CPU</text>
    <text x="409" y="427">Memory shared</text>
    <text x="409" y="443">with the CPU</text>
    <text x="613" y="427">Each GPU has its own</text>
    <text x="613" y="443">dedicated memory</text>
  </g>
</svg>
