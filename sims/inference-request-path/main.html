<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Inference Request Path using Mermaid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Inference Request Path</h1>
        <div class="stage">
            <span class="tag">synthetic example</span>
            <div id="diagram" role="img" aria-label="Flowchart of the six stages of a chat completion request in a row: client, endpoint, request handler, model loader, generation, and response."></div>
        </div>
        <div class="panel">
            <div class="status-row">
                <span id="status"></span>
                <span id="score"></span>
            </div>
            <p id="prompt" class="prompt"></p>
            <p id="detail" class="detail" hidden></p>
            <div id="choices" class="choices"></div>
            <p id="feedback" class="feedback" hidden></p>
            <div id="results" class="results" hidden></div>
            <div class="actions">
                <button id="start">Start the questions</button>
                <button id="confirm">Confirm</button>
                <button id="next">Next question</button>
                <button id="restart">Start over</button>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
    <script type="module" src="inference-request-path.js"></script>
</body>
</html>
